name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM UTC
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  # Parallel test execution with right-sized memory allocation
  test:
    name: Test (${{ matrix.suite.name }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        suite:
          - name: "security-cache-server"
            path: "tests/security/ tests/cache/ tests/server/"
            memory: "4096"
          - name: "client-config-utils"
            path: "tests/client/ tests/config/ tests/utils/"
            memory: "6144"
          - name: "tools-performance"
            path: "tests/tools/ tests/performance/"
            memory: "4096"
          - name: "root-docs"
            path: "tests/*.test.js tests/docs/"
            memory: "2048"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build project
        run: npm run build

      - name: Run tests - ${{ matrix.suite.name }}
        run:
          NODE_OPTIONS="--max-old-space-size=${{ matrix.suite.memory }}" npx vitest run ${{ matrix.suite.path }}
          --no-coverage --reporter=default
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite.name }}-node-${{ matrix.node-version }}
          path: |
            coverage/
            tests/results/

  # Quality checks (linting, security, etc.) - no test execution here
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build project
        run: npm run build

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Security audit
        run: node scripts/security-audit-gate.js

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # Build and package
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build project
        run: npm run build

      - name: Pack and smoke-test the published tarball
        run: |
          npm pack
          PACKAGE_TARBALL="$(ls mcp-wordpress-*.tgz)"
          SMOKE_DIR="$(mktemp -d)"
          cp "$PACKAGE_TARBALL" "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "./$PACKAGE_TARBALL"
          # --health-check is finite (no stdio transport, no live WordPress
          # calls) and exits 1 without WordPress configured. A crash here
          # (missing module, broken import, etc. from an incomplete "files"
          # list) would fail differently, not print this exact message.
          set +e
          node_modules/.bin/mcp-wordpress --health-check > health-check-output.txt 2>&1
          HEALTH_CHECK_EXIT=$?
          set -e
          cat health-check-output.txt
          if [ "$HEALTH_CHECK_EXIT" -ne 1 ]; then
            echo "Expected exit code 1 (unconfigured), got $HEALTH_CHECK_EXIT" >&2
            exit 1
          fi
          grep -q "Health check failed: no WordPress sites configured" health-check-output.txt
          node node_modules/mcp-wordpress/bin/status.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            package.json
            README.md
            LICENSE

  # NPM publishing is handled by release.yml (semantic-release + fallback)
  # Docker publishing is handled by release.yml and docker-modern.yml

  # Update badges and documentation
  update-badges:
    name: Update Badges
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build project
        run: npm run build

      - name: Generate coverage badge data
        run: npm run test:coverage
        continue-on-error: true

      - name: Update documentation
        run: |
          if [ -f "scripts/update-badges.js" ]; then
            node scripts/update-badges.js
          fi
        continue-on-error: true

      - name: Commit badge updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update badges and documentation [skip ci]"
          file_pattern: "README.md docs/**"
        continue-on-error: true
