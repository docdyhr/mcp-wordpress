name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # OIDC tokens are unavailable for fork PRs (GitHub restriction); skip to avoid spurious failures.
    # Also skip when the triggering push's sender is a bot/app (e.g. GitHub Copilot's coding agent,
    # login "Copilot" / https://github.com/apps/copilot-swe-agent): the action's OIDC-to-app-token
    # exchange rejects bot actors with "User does not have write access on this repository" even on
    # same-repo PRs, so the job fails before it can review anything.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    # One review per PR: a newer push cancels the running review, and the next run resets its sticky comment.
    # Bot-sender events, skipped above, get their own group so they never cancel a human's review.
    concurrency:
      group:
        claude-review-${{ github.event.pull_request.number }}${{ github.event.sender.type == 'Bot' && '-bot' || '' }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Prompt for automated review (no @claude mention needed)
          prompt: |
            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

          # Tag mode: the review is written into one top-level tracking comment, rewritten on each push. Without
          # these, v1 runs a plain prompt in agent mode, which has no comment tools, so the review posts nothing.
          track_progress: true
          use_sticky_comment: true
          include_fix_links: false

          # Tag mode also grants file edits and git add/commit/rm, and it reads the PR's comments. Keep the
          # automatic review read-only, and read comments only from the owner and bots (this repo is public).
          include_comments_by_actor: "docdyhr,*[bot]"
          claude_args: |
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
