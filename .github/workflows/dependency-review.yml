name: 🔍 Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    # Skip dependency review for non-dependency files
    paths-ignore:
      - "security-fixes.txt"
      - "update-report-*.md"
      - "updates-*.json"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    name: 🔍 Dependency Security Review
    runs-on: ubuntu-latest
    # Runs on every PR, including Dependabot's own — it previously skipped those (and any PR
    # labeled "dependencies"), the exact gap a security review flagged. continue-on-error below
    # already protects against this failing a Dependabot PR outright when GitHub Advanced
    # Security isn't available; there's no reason to also skip it entirely.
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        # Runtime HIGH+ findings now block merge (item 6 of the security audit
        # remediation plan). Previously continue-on-error: true meant this step
        # could never fail a PR even when GitHub Advanced Security was enabled
        # and found a real vulnerability — fail-on-severity/fail-on-scopes
        # below were configured but toothless. If GitHub Advanced Security is
        # genuinely unavailable, the action itself exits successfully (it only
        # fails on an actual finding), so this isn't expected to false-positive
        # on repos without it enabled.
        with:
          # Make less strict for dependency updates
          fail-on-severity: high # Changed from 'moderate' to 'high'
          # Fail if vulnerabilities are found in runtime dependencies
          fail-on-scopes: runtime
          # License check (allow common open source licenses)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, Unlicense, LGPL-2.1, LGPL-3.0
          # Security advisories configuration
          allow-ghsas: false
          # Comment on PR with results (only on failure for dependency PRs)
          comment-summary-in-pr: on-failure # Changed from 'always'
          # Vulnerability severity threshold
          vulnerability-check: true
          # License compliance check (relaxed for dependency updates)
          license-check: true # Keep enabled but make non-blocking
          # Show OpenSSF Scorecard information
          show-openssf-scorecard: true # Keep enabled for supply chain visibility

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: 🔍 NPM Security Audit
        run: |
          npm audit --omit=dev --json > audit-results.json 2>/dev/null || true

          {
            echo "## 🔍 NPM Security Audit Results"
            echo ""
            echo "- 🔴 Critical: $(jq -r '.metadata.vulnerabilities.critical // 0' audit-results.json)"
            echo "- 🟠 High: $(jq -r '.metadata.vulnerabilities.high // 0' audit-results.json)"
            echo "- 🟡 Moderate: $(jq -r '.metadata.vulnerabilities.moderate // 0' audit-results.json)"
            echo "- 🟢 Low: $(jq -r '.metadata.vulnerabilities.low // 0' audit-results.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🎯 Production Dependency Audit Gate
        run: node scripts/security-audit-gate.js

      - name: 📊 Upload Security Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30

  license-compliance:
    name: 📜 License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: 📜 License Checker
        run: |
          # Install license checker
          npm install -g license-checker

          echo "## 📜 License Compliance Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Generate license report
          license-checker --json > licenses.json

          # Check for problematic licenses
          PROBLEMATIC_LICENSES="GPL-2.0,AGPL-1.0,AGPL-3.0,LGPL-2.0"

          if license-checker --excludePackages 'dev-dependencies' --restrictLicenses "$PROBLEMATIC_LICENSES" --summary; then
            echo "✅ **No problematic licenses found**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Problematic licenses detected**" >> "$GITHUB_STEP_SUMMARY"
            echo "Please review the licenses and ensure compliance." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Count license types
          TOTAL_LICENSES=$(cat licenses.json | jq 'keys | length')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total packages analyzed:** $TOTAL_LICENSES" >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Upload License Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  supply-chain-security:
    name: 🔗 Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 🔍 Package Lock Analysis
        run: |
          echo "## 🔗 Supply Chain Security Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check for package-lock.json integrity
          if [ -f package-lock.json ]; then
            echo "✅ **package-lock.json found**" >> "$GITHUB_STEP_SUMMARY"

            # Check lockfile version
            LOCKFILE_VERSION=$(cat package-lock.json | jq -r '.lockfileVersion')
            echo "- Lockfile version: $LOCKFILE_VERSION" >> "$GITHUB_STEP_SUMMARY"

            # Count dependencies
            DEPS_COUNT=$(cat package-lock.json | jq '.dependencies | length // 0')
            echo "- Total dependencies: $DEPS_COUNT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **package-lock.json missing**" >> "$GITHUB_STEP_SUMMARY"
            echo "Consider using npm ci for reproducible builds." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Check for .npmrc security settings
          if [ -f .npmrc ]; then
            echo "📄 **.npmrc configuration found**" >> "$GITHUB_STEP_SUMMARY"
          fi

  dependency-summary:
    name: 📊 Dependency Review Summary
    runs-on: ubuntu-latest
    needs: [dependency-review, security-audit, license-compliance, supply-chain-security]
    if: always()
    steps:
      - name: 📊 Generate Summary Report
        run: |
          {
            echo "## 📊 Dependency Review Summary"
            echo ""
            echo "### 🔍 Review Results"
            echo "- **Dependency Review:** ${{ needs.dependency-review.result }}"
            echo "- **Security Audit:** ${{ needs.security-audit.result }}"
            echo "- **License Compliance:** ${{ needs.license-compliance.result }}"
            echo "- **Supply Chain Security:** ${{ needs.supply-chain-security.result }}"
            echo ""
            echo "### 📋 Configuration Summary"
            echo "- **Fail on severity:** high and above (relaxed for dependency updates)"
            echo "- **Fail on scopes:** runtime dependencies"
            echo "- **Allowed licenses:** MIT, Apache-2.0, BSD, ISC, CC0, Unlicense, LGPL"
            echo "- **OpenSSF Scorecard:** Enabled for supply chain visibility"
            echo ""
            echo "### 📝 Recommendations"
            echo "1. **Address any security vulnerabilities** found in the audit"
            echo "2. **Review license compliance** for any flagged packages"
            echo "3. **Ensure package-lock.json** is committed and up-to-date"
            echo "4. **Monitor dependency changes** in this PR carefully"
            echo ""
            echo "### 🔗 Resources"
            echo "- [Dependency Review Documentation](https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review)"
            echo "- [NPM Security Best Practices](https://docs.npmjs.com/security)"
          } >> "$GITHUB_STEP_SUMMARY"
