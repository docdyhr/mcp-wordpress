name: 🛡️ Scheduled Security Scan

# Item 8 of the security audit remediation plan: main-ci.yml and
# codeql-analysis.yml already run on a schedule, but neither files a
# trackable ticket on failure — a finding that appears between releases
# could sit unnoticed in scheduled-run logs. This workflow runs the same
# production dependency audit gate used by CI/pre-push, plus a filesystem
# Trivy scan, and opens (or comments on) a GitHub issue whenever either
# fails.

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scheduled-security-scan:
    name: 🔍 Weekly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: 🔒 Production Dependency Audit Gate
        run: npm run security:scan

      - name: 🔍 Trivy Filesystem Scan
        # node_modules is excluded: npm-ecosystem CVEs are already covered (and
        # gated) by the audit step above using npm's own advisory data, which is
        # more precise for this ecosystem than Trivy's lockfile heuristics. What
        # Trivy's bundler scanner was actually finding here was a Gemfile.lock
        # vendored inside @pact-foundation/pact-node's standalone binary
        # (node_modules/@pact-foundation/pact-node/standalone/*/pact/lib/vendor) —
        # a bundled Ruby runtime for Pact's legacy mock-service/verifier that
        # ships with the npm package itself. It's dev-only tooling never invoked
        # in the shipped server, not something a package.json override can patch
        # (it's a vendored binary, not an npm-resolved dependency), and unrelated
        # to any code change in this repo, so it was reopening this workflow's
        # tracking issue every week for a finding nobody can act on.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          skip-dirs: "node_modules"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: 📋 File or Update Tracking Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = "scheduled-security-scan";

            // issues.create() 422s if a label doesn't exist yet, and this label
            // is newly introduced by this workflow — create it before first use.
            // 422 on the create call itself means it already exists (a prior
            // run created it, or someone added it manually); anything else is
            // a real error worth surfacing.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "d73a4a",
                description: "Opened by the weekly scheduled security scan on failure",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Scheduled security scan failed again: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Scheduled security scan failed",
              body: [
                "The weekly scheduled security scan found new HIGH/CRITICAL findings.",
                "",
                `Run: ${runUrl}`,
                "",
                "Check the `security:scan` (npm audit gate) and Trivy filesystem scan step logs for details.",
                "Close this issue once the underlying finding is fixed or reviewed with a time-boxed exception in security-exceptions.json.",
              ].join("\n"),
              labels: [label],
            });
