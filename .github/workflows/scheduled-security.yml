name: 🛡️ Scheduled Security Scan

# Item 8 of the security audit remediation plan: main-ci.yml and
# codeql-analysis.yml already run on a schedule, but neither files a
# trackable ticket on failure — a finding that appears between releases
# could sit unnoticed in scheduled-run logs. This workflow runs the same
# production dependency audit gate used by CI/pre-push, plus a filesystem
# Trivy scan, and opens (or comments on) a GitHub issue whenever either
# fails.

on:
  schedule:
    - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scheduled-security-scan:
    name: 🔍 Weekly Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: 🔒 Production Dependency Audit Gate
        run: npm run security:scan

      - name: 🔍 Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: 📋 File or Update Tracking Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = "scheduled-security-scan";

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Scheduled security scan failed again: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Scheduled security scan failed",
              body: [
                "The weekly scheduled security scan found new HIGH/CRITICAL findings.",
                "",
                `Run: ${runUrl}`,
                "",
                "Check the `security:scan` (npm audit gate) and Trivy filesystem scan step logs for details.",
                "Close this issue once the underlying finding is fixed or reviewed with a time-boxed exception in security-exceptions.json.",
              ].join("\n"),
              labels: [label],
            });
