# Dependabot configuration for automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# One invalid value makes GitHub reject this whole file. Dependabot then keeps
# using the last valid version, if there is one, and edits silently stop taking
# effect. The only trace is a failing `.github/dependabot.yml` check run on the
# commit that changed it. This file was never valid on main from 2025-07 to
# 2026-10, so no scheduled version update ever ran.
# tests/dependabot-config.test.js guards the known traps.
#
# No `target-branch`: once it is set, the options below stop applying to
# security updates, which always target the default branch.
# No `reviewers`: Dependabot no longer supports it; .github/CODEOWNERS
# requests the review instead.

version: 2
updates:
  # 📦 NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Security updates are prioritized
    open-pull-requests-limit: 10
    assignees:
      - "docdyhr"
    # chore(deps) / chore(deps-dev): the conventional-commit types this repo
    # already uses for dependency bumps; `chore` does not cut a release
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Entry-level labels go on every PR from the entry, version updates
    # included, so none of them may claim `security`
    labels:
      - "dependencies"
      - "javascript"
    allow:
      - dependency-type: "all"
    # Group related updates together
    groups:
      # A group's `update-types` accepts only major/minor/patch; security-only
      # grouping is expressed with `applies-to`
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "@modelcontextprotocol/*"
          - "zod*"
          - "dotenv"
          - "form-data"
          - "hono"
        exclude-patterns:
          - "@types/*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"
          # @vitest/ui etc. must move with vitest: alone, @vitest/ui 5 cannot
          # install against vitest 4 (#280, npm ERESOLVE)
          - "@vitest/*"
          - "typescript*"
          - "@typescript-eslint/*"
      wordpress-packages:
        patterns:
          - "wordpress*"
          - "@wordpress/*"
    # TypeScript majors wait until @typescript-eslint accepts them: TS 7 failed
    # `npm ci` against @typescript-eslint 8.71 (#278, ERESOLVE). Bump by hand.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Rebase strategy for conflicts
    rebase-strategy: "auto"

  # 🔧 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    assignees:
      - "docdyhr"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"

  # 🐳 Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    assignees:
      - "docdyhr"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Node majors move by hand to the next even-numbered (LTS) line, together
    # with `engines` and the CI matrix (22/24). Dependabot proposed the odd,
    # non-LTS node:25-alpine (#276).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
# Security updates are automatically created for all ecosystems
# and take priority over the schedule defined above
